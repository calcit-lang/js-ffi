name: Check

on:
  push:
    branches:
      - master
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - uses: calcit-lang/setup-calcit@v1.4.0

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Validate Calcit snapshot and types
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru --format json
          yarn audit:unsafe

      - name: Check Node entry
        run: yarn check:node

      - name: Check browser entry
        run: yarn check:browser

      - name: Compile Node smoke tests
        run: yarn compile:node

      - name: Run Node smoke test
        run: node node.mjs

      - name: Run Node FFI contract test
        run: node node-contract.mjs

      - name: Run browser global contract test in Node
        run: yarn test:contract:browser-node

      - name: Build browser smoke app
        run: yarn build:browser
