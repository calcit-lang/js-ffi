name: Check

on:
  push:
    branches:
      - prepare/jsffi-dom031

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@4.18.0 --activate

      - name: Cache Yarn packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Apply reviewed DOM capability correction with formal CLI
        run: |
          set -euo pipefail
          test "$(git hash-object calcit.cirru)" = f92f6ae3ada262538f48fb09415dd93a12806d9b
          node acceptance/prepare-dom.mjs
          calcit edit format
          git hash-object calcit.cirru > acceptance/source-blob.txt
          cp calcit.cirru acceptance/calcit.cirru

      - name: Validate Calcit snapshot and types
        run: |
          calcit calcit.cirru edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/source-blob.txt)"
          calcit calcit.cirru --check-only
          calcit fix --workflow strict --verify
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru --format json
          yarn audit:unsafe

      - name: Verify public API catalog and all definitions
        run: |
          yarn api:check
          yarn check:api
          yarn test:tooling

      - name: Check Node entry
        run: yarn check:node

      - name: Check browser entry
        run: yarn check:browser

      - name: Check invalid FFI consumer types
        run: |
          calcit test --require-match
          yarn test:types

      - name: Compile Node smoke tests
        run: yarn compile:node

      - name: Run Node smoke test
        run: node node.mjs

      - name: Run Node FFI contract test
        run: node node-contract.mjs

      - name: Run extended Node and shared API tests
        run: node --test tests/node.mjs tests/recipes.mjs

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: |
          yarn playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            yarn playwright install chromium
          fi

      - name: Run real browser API tests
        run: yarn test:browser

      - name: Build browser smoke app
        run: yarn build:browser

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: jsffi-dom-${{ github.run_id }}
          path: |
            acceptance
            dist
            js-out
          retention-days: 7
          if-no-files-found: error
