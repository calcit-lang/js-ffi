name: Check

on:
  push:
    branches:
      - master
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@4.18.0 --activate

      - name: Cache Yarn packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      # Remove this backport when deps.cirru pins a release containing calcit#2749.
      - name: Build Calcit 0.42.1 with the nested callback fix
        uses: actions/checkout@v7.0.1
        with:
          repository: calcit-lang/calcit
          ref: 8500bae675f4fe9d582328b73e06cfd1d04a0aad # 0.42.1 release source
          path: .calcit/cli-backport
          persist-credentials: false

      - name: Apply the compiler fix
        working-directory: .calcit/cli-backport
        run: |
          git apply --check "$GITHUB_WORKSPACE/.github/patches/calcit-0.42.1-nested-callback.patch"
          git apply "$GITHUB_WORKSPACE/.github/patches/calcit-0.42.1-nested-callback.patch"
          cargo build --locked --profile ci --bin calcit
          test "$(target/ci/calcit -v)" = "0.42.1"
          echo "$PWD/target/ci" >> "$GITHUB_PATH"

      - name: Validate Calcit snapshot and types
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit fix --workflow strict --verify
          yarn check:quality
          yarn audit:unsafe

      - name: Verify public API catalog and all definitions
        run: |
          yarn api:check
          yarn check:api
          yarn test:tooling

      - name: Check Node entry
        run: yarn check:node

      - name: Check browser entry
        run: yarn check:browser

      - name: Check invalid FFI consumer types
        run: |
          calcit test --require-match
          yarn test:types

      - name: Compile Node smoke tests
        run: yarn compile:node

      - name: Run Node smoke test
        run: node node.mjs

      - name: Run Node FFI contract test
        run: node node-contract.mjs

      - name: Run extended Node and shared API tests
        run: node --test tests/node.mjs tests/recipes.mjs

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: |
          yarn playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            yarn playwright install chromium
          fi

      - name: Run real browser API tests
        run: yarn test:browser

      - name: Build browser smoke app
        run: yarn build:browser
