name: Check

on:
  push:
    branches:
      - master
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Yarn
        run: corepack enable && corepack prepare yarn@4.12.0 --activate

      - uses: calcit-lang/setup-calcit@v1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Calcit snapshot and types
        run: |
          caps --ci
          cr calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          cr calcit.cirru --check-only
          cr calcit.cirru analyze quality --baseline config/calcit-quality.json --format json

      - name: Check Node entry
        run: yarn check:node

      - name: Check browser entry
        run: yarn check:browser

      - name: Compile Node smoke tests
        run: yarn compile:node

      - name: Run Node smoke test
        run: node node.mjs

      - name: Run Node FFI contract test
        run: node node-contract.mjs

      - name: Build browser smoke app
        run: yarn build:browser
